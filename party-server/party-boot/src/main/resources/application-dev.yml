# 开发环境配置
# 数据库使用专用账号 hongmai，仅授权 hongmai_party 库（避免用 root 连业务库）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 必须是 Java 字符集名（UTF-8），不能写 MySQL 服务端的 utf8mb4 ——
    # 写错会让连接在建立阶段就抛 UnsupportedEncodingException，报错信息还容易被误读成网络问题。
    # 服务端侧的 utf8mb4 由驱动自动协商，无需在这里指定。
    url: jdbc:mysql://127.0.0.1:3306/hongmai_party?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: hongmai
    password: ***REMOVED***
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# 开发联调开关。
# 打开后才会注册 /dev/auth/login（免微信登录）。生产配置必须不设或设为 false，
# 否则任何人都能凭一个 openId 拿到登录态。
app:
  dev-login-enabled: true

# 敏感字段加密密钥（仅开发环境，生产必须改为环境变量注入）
# 明文为 ***REMOVED***（32 字节），换密钥会导致既有密文无法解密
crypto:
  key: "***REMOVED***"

# 微信小程序（开发占位，需替换为真实 appid/secret）
wechat:
  miniapp:
    app-id: wxdevplaceholder0000
    app-secret: dev-placeholder-secret
    code2session-url: https://api.weixin.qq.com/sns/jscode2session
